<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000004" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; script-src 'unsafe-inline'; connect-src https://izmxaqcvvwpnvukizbdw.supabase.co; base-uri 'none'; form-action 'none'" />
  <title>Get Streak</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top, #121826 0%, #000004 55%);
      color: #e8edf5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; width: 100%; }
    .logo {
      width: 148px;
      height: auto;
      margin: 0 auto 28px;
      display: block;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0 0 12px;
    }
    p {
      color: rgba(232,237,245,0.65);
      line-height: 1.5;
      margin: 0 0 28px;
      font-size: 15px;
    }
    .cta {
      display: inline-block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      background: #c8d8f0;
      color: #04060c;
      font-weight: 800;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .secondary {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 16px;
      border: 1px solid rgba(200,216,240,0.25);
      color: #c8d8f0;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 18px;
    }
    .hint { font-size: 12px; color: #6b7a94; line-height: 1.45; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/streak-logo-white.png" alt="Streak" width="148" height="40" />
    <h1 id="title">Start your recovery</h1>
    <p id="body">Download Streak and continue on your phone.</p>
    <a class="cta" id="storeBtn" href="https://apps.apple.com/app/id6782550146">Download on the App Store</a>
    <a class="secondary" id="openAppBtn" href="streak://ref" hidden>Open Streak app</a>
    <p class="hint" id="hint">Open this page on your phone to download Streak.</p>
  </main>
  <script>
    (function () {
      var SUPABASE_URL = 'https://izmxaqcvvwpnvukizbdw.supabase.co';
      var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6bXhhcWN2dndwbnZ1a2l6YmR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzOTA1OTAsImV4cCI6MjA5NTk2NjU5MH0.AhMiKf3WLjBGqREMfrFikaSEn9kfynrWSg84FfBApwI';
      var STORE = 'https://apps.apple.com/app/id6782550146';

      var params = new URLSearchParams(window.location.search);
      var pathParts = window.location.pathname.split('/').filter(Boolean);
      var code = (params.get('ref') || params.get('code') || params.get('referral') || '').toLowerCase();
      if (!code && pathParts.length >= 2 && pathParts[0] === 'r') {
        code = String(pathParts[1] || '').toLowerCase();
      }
      code = code.replace(/[^a-z0-9_-]/g, '').slice(0, 32);

      var campaign = (params.get('campaign') || params.get('utm_campaign') || '').toLowerCase();
      campaign = campaign.replace(/[^a-z0-9_-]/g, '').slice(0, 64);

      var clickId = null;
      var deepLink = 'streak://ref';

      function setOpenAppHref() {
        var btn = document.getElementById('openAppBtn');
        if (!btn) return;
        if (clickId && code) {
          btn.href = 'streak://ref?click=' + encodeURIComponent(clickId) + '&code=' + encodeURIComponent(code) +
            (campaign ? '&campaign=' + encodeURIComponent(campaign) : '');
          btn.hidden = false;
        } else if (code) {
          btn.href = 'streak://ref?code=' + encodeURIComponent(code) +
            (campaign ? '&campaign=' + encodeURIComponent(campaign) : '');
          btn.hidden = false;
        }
      }

      function track(eventName) {
        if (!code) return Promise.resolve(null);
        return fetch(SUPABASE_URL + '/functions/v1/track-referral-click', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({
            code: code,
            event: eventName || 'view',
            click_id: clickId || undefined,
            campaign: campaign || undefined,
          }),
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            if (!res.ok || !res.j || !res.j.click_id) return null;
            clickId = res.j.click_id;
            try { localStorage.setItem('streak_ref_click', clickId); } catch (e) {}
            try { localStorage.setItem('streak_ref', code); } catch (e) {}
            if (campaign) {
              try { localStorage.setItem('streak_ref_campaign', campaign); } catch (e) {}
            }
            if (res.j.campaign) campaign = String(res.j.campaign);
            if (res.j.deep_link) deepLink = res.j.deep_link;
            setOpenAppHref();
            return clickId;
          })
          .catch(function () { return null; });
      }

      var storeBtn = document.getElementById('storeBtn');
      storeBtn.href = STORE;

      if (code) {
        try {
          var saved = localStorage.getItem('streak_ref_click');
          if (saved) clickId = saved;
        } catch (e) {}

        document.getElementById('title').textContent = 'You were referred to Streak';
        document.getElementById('body').textContent =
          'Download the app and create your account to get started.';
        document.getElementById('hint').textContent =
          'Shareable link: https://streakofficial.com/r/?ref=' + code +
          (campaign ? '&campaign=' + campaign : '');
        setOpenAppHref();

        track('view');

        storeBtn.addEventListener('click', function () {
          track('download');
        });
      }
    })();
  </script>
</body>
</html>
